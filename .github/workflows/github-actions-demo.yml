name: Update MTA GTFS (Nightly Cache)

on:
  schedule:
    - cron: "0 7 * * *"   # 2 AM ET
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and cache BusTime GTFS
        env:
          MTA_BUSTIME_KEY: ${{ secrets.MTA_BUSTIME_KEY }}
        run: python scripts/cache_gtfs.py

      - name: Commit updated GTFS files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/*.json
          git commit -m "Nightly GTFS update" || echo "No changes"
          git push

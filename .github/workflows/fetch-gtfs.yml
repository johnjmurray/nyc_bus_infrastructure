name: Fetch MTA GTFS Feeds

on:
  workflow_dispatch:    # allows manual triggering
  schedule:
    - cron: "0 */6 * * *"   # runs every 6 hours (adjust as needed)

jobs:
  update-gtfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Create working directory
        run: mkdir -p gtfs

      - name: Download GTFS feeds
        run: |
          # Add or remove feeds as needed
          curl -L -o gtfs/gtfs_bx.zip https://rrgtfsfeeds.s3.amazonaws.com/gtfs_bx.zip
          curl -L -o gtfs/gtfs_b.zip https://rrgtfsfeeds.s3.amazonaws.com/gtfs_b.zip
          curl -L -o gtfs/gtfs_m.zip https://rrgtfsfeeds.s3.amazonaws.com/gtfs_m.zip
          curl -L -o gtfs/gtfs_q.zip https://rrgtfsfeeds.s3.amazonaws.com/gtfs_q.zip
          curl -L -o gtfs/gtfs_si.zip https://rrgtfsfeeds.s3.amazonaws.com/gtfs_si.zip
          curl -L -o gtfs/gtfs_busco.zip https://rrgtfsfeeds.s3.amazonaws.com/gtfs_busco.zip


      - name: Extract ONLY shapes.txt and stops.txt
        run: |
          for z in gtfs/*.zip; do
            feed=$(basename "$z" .zip)
            mkdir -p "feeds/$feed"
            unzip -j "$z" shapes.txt -d "feeds/$feed" || true
            unzip -j "$z" stops.txt -d "feeds/$feed" || true
          done

      - name: Convert GTFS to GeoJSON
        run: |
          python3 << 'EOF'
            import pandas as pd
          from shapely.geometry import LineString, Point
          import json
          import os
          
          os.makedirs("geojson", exist_ok=True)
          
          for feed in os.listdir("feeds"):
              feed_path = os.path.join("feeds", feed)
          
              shapes_file = os.path.join(feed_path, "shapes.txt")
              stops_file = os.path.join(feed_path, "stops.txt")
          
              # Process shapes.txt → LineString GeoJSON
              if os.path.exists(shapes_file):
                  shapes = pd.read_csv(shapes_file)
                  features = []
          
                  for shape_id, group in shapes.groupby("shape_id"):
                      coords = list(zip(group["shape_pt_lon"], group["shape_pt_lat"]))
                      geom = LineString(coords)
                      features.append({
                          "type": "Feature",
                          "geometry": json.loads(json.dumps(geom.__geo_interface__)),
                          "properties": {"shape_id": shape_id}
                      })
          
                  geojson_obj = {"type": "FeatureCollection", "features": features}
          
                  with open(f"geojson/{feed}_shapes.geojson", "w") as f:
                      json.dump(geojson_obj, f)
          
              # Process stops.txt → Point GeoJSON
              if os.path.exists(stops_file):
                  stops = pd.read_csv(stops_file)
                  features = []
          
                  for _, row in stops.iterrows():
                      geom = Point(row["stop_lon"], row["stop_lat"])
                      features.append({
                          "type": "Feature",
                          "geometry": json.loads(json.dumps(geom.__geo_interface__)),
                          "properties": {
                              "stop_id": row.get("stop_id"),
                              "stop_name": row.get("stop_name")
                          }
                      })
          
                  geojson_obj = {"type": "FeatureCollection", "features": features}
          
                  with open(f"geojson/{feed}_stops.geojson", "w") as f:
                      json.dump(geojson_obj, f)
          EOF
          

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Updated GTFS feeds"
            git push
          fi
